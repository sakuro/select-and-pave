name: Spec

# Part of the optional test lane: a MOD without `.busted` does not have this file.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  spec:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install build dependencies for Lua
      run: sudo apt-get update && sudo apt-get install -y libreadline-dev

    - name: Setup mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

    - name: Run tests
      run: mise run test
